spring.application.name=wacdo
# Profil actif : "dev" déclenche l'insertion du jeu de test (DataFixture)
spring.profiles.active=dev

spring.devtools.restart.enabled=true

# Configuration de la base de données
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/wacdo_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# Configurations Hibernate (JPA)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
