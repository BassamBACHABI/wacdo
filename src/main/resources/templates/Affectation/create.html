<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: page('Nouvelle affectation', ~{::contenu}, true)}">
<body>

<div th:fragment="contenu" class="max-w-2xl">

  <h1 class="text-2xl font-bold text-slate-800 mb-1">Nouvelle affectation</h1>
  <p class="text-sm text-slate-500 mb-6">Renseignez les informations de l'affectation</p>

  <form th:action="@{/affectation/create}" th:object="${affectation}" method="post"
        class="bg-white rounded-lg shadow p-6 space-y-5">

    <!-- Collaborateur -->
    <select id="collaborateur" th:field="*{collaborateurId}" required ...>
      <option value="">-- Sélectionner un collaborateur --</option>
      <option th:each="c : ${collaborateurs}" th:value="${c.id}"
              th:text="${c.prenom + ' ' + c.nom}"></option>
    </select>
    <p th:if="${#fields.hasErrors('collaborateurId')}" th:errors="*{collaborateurId}"
       class="mt-1 text-xs text-red-600"></p>

    <!-- Restaurant -->
    <select id="restaurant" th:field="*{restaurantId}" required ...>
      <option value="">-- Sélectionner un restaurant --</option>
      <option th:each="r : ${restaurants}" th:value="${r.id}" th:text="${r.nom}"></option>
    </select>
    <p th:if="${#fields.hasErrors('restaurantId')}" th:errors="*{restaurantId}"
       class="mt-1 text-xs text-red-600"></p>

    <!-- Fonction -->
    <select id="fonction" th:field="*{fonctionId}" required ...>
      <option value="">-- Sélectionner une fonction --</option>
      <option th:each="f : ${fonctions}" th:value="${f.id}" th:text="${f.intitulePoste}"></option>
    </select>
    <p th:if="${#fields.hasErrors('fonctionId')}" th:errors="*{fonctionId}"
       class="mt-1 text-xs text-red-600"></p>

    <!-- Dates -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
      <div>
        <label for="dateDebut" class="block text-sm font-medium text-slate-700 mb-1">Date de début</label>
        <input type="date" id="dateDebut" th:field="*{dateDebut}" required
               class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm
                      focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500">
        <p th:if="${#fields.hasErrors('dateDebut')}" th:errors="*{dateDebut}"
           class="mt-1 text-xs text-red-600"></p>
      </div>

      <div>
        <label for="dateFin" class="block text-sm font-medium text-slate-700 mb-1">
          Date de fin <span class="text-slate-400 font-normal">(optionnelle)</span>
        </label>
        <input type="date" id="dateFin" th:field="*{dateFin}"
               class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm
                      focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500">
        <p th:if="${#fields.hasErrors('dateFin')}" th:errors="*{dateFin}"
           class="mt-1 text-xs text-red-600"></p>
      </div>
    </div>

    <div class="flex items-center justify-end gap-3 pt-2 border-t border-slate-200">
      <a th:href="@{/affectation}"
         class="px-4 py-2 text-sm font-medium text-slate-600 hover:text-slate-800">Annuler</a>
      <button type="submit"
              class="px-4 py-2 rounded-md bg-amber-600 text-white text-sm font-medium
                     hover:bg-amber-700 focus:outline-none focus:ring-2 focus:ring-amber-500
                     focus:ring-offset-2">
        Enregistrer
      </button>
    </div>

  </form>

</div>

</body>
</html>
