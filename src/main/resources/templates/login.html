<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: page('Connexion', ~{::contenu}, false)}">
<body>

<div th:fragment="contenu" class="flex-1 flex flex-col justify-center items-center">

  <div class="w-full max-w-sm">

  <h1 class="text-2xl font-bold text-slate-800 mb-1 text-center">Connexion</h1>
  <p class="text-sm text-slate-500 mb-6 text-center">Accédez à votre espace collaborateur.</p>

  <div th:if="${param.error}"
       class="mb-4 rounded-md border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">
    Email ou mot de passe incorrect.
  </div>

  <div th:if="${param.logout}"
       class="mb-4 rounded-md border border-emerald-200 bg-emerald-50 px-3 py-2 text-sm text-emerald-700">
    Vous avez été déconnecté.
  </div>

  <form th:action="@{/login}" method="post"
        class="bg-white rounded-lg shadow p-6 space-y-5">

    <div>
      <label for="username" class="block text-sm font-medium text-slate-700 mb-1">Email</label>
      <input type="email" id="username" name="username" required autofocus
             placeholder="prenom.nom@wacdo.fr"
             class="w-full rounded-md border border-slate-300 px-3 py-2 text-slate-800
                    focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500">
    </div>

    <div>
      <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Mot de passe</label>
      <input type="password" id="password" name="password" required
             class="w-full rounded-md border border-slate-300 px-3 py-2 text-slate-800
                    focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500">
    </div>

    <button type="submit"
            class="w-full px-4 py-2 rounded-md bg-amber-600 text-white text-sm font-medium
                   hover:bg-amber-700 focus:outline-none focus:ring-2 focus:ring-amber-500
                   focus:ring-offset-2">
      Se connecter
    </button>

  </form>

  </div>

</div>

</body>
</html>
