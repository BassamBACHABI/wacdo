<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: page('Nouvelle fonction', ~{::contenu}, true)}">
<body>

<div th:fragment="contenu" class="max-w-2xl">

  <h1 class="text-2xl font-bold text-slate-800 mb-1">Nouvelle fonction</h1>
  <p class="text-sm text-slate-500 mb-6">Renseignez l'intitulé du poste à enregistrer.</p>

  <form th:action="@{/fonction/create}" th:object="${fonction}" method="post"
        class="bg-white rounded-lg shadow p-6 space-y-5">

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
      <div>
        <label for="intitulePoste" class="block text-sm font-medium text-slate-700 mb-1">Poste</label>
        <input type="text" id="intitulePoste" th:field="*{intitulePoste}" required
               class="w-full rounded-md border border-slate-300 px-3 py-2 text-slate-800
                      focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500">
      </div>
    </div>

    <div class="flex items-center justify-end gap-3 pt-2 border-t border-slate-200">
      <a th:href="@{/fonction}"
         class="px-4 py-2 text-sm font-medium text-slate-600 hover:text-slate-800">Annuler</a>
      <button type="submit"
              class="px-4 py-2 rounded-md bg-amber-600 text-white text-sm font-medium
                     hover:bg-amber-700 focus:outline-none focus:ring-2 focus:ring-amber-500
                     focus:ring-offset-2">
        Enregistrer
      </button>
    </div>

  </form>

</div>

</body>
</html>
