<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: page('Modifier Restaurant', ~{::contenu}, true)}">
<body>

<div th:fragment="contenu" class="max-w-2xl">

  <h1 class="text-2xl font-bold text-slate-800 mb-1">Modifier un restaurant</h1>
  <p class="text-sm text-slate-500 mb-6">Renseignez les informations du restaurant à modifier.</p>

  <form th:action="@{/restaurants/update}" th:object="${restaurant}" method="post"
        class="bg-white rounded-lg shadow p-6 space-y-5">

    <input type="hidden" th:field="*{id}">

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
      <div>
        <label for="nom" class="block text-sm font-medium text-slate-700 mb-1">Nom</label>
        <input type="text" id="nom" th:field="*{nom}" required
               class="w-full rounded-md border border-slate-300 px-3 py-2 text-slate-800
                      focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500">
      </div>

      <div>
        <label for="adresse" class="block text-sm font-medium text-slate-700 mb-1">Adresse</label>
        <input type="text" id="adresse" th:field="*{adresse}" required
               class="w-full rounded-md border border-slate-300 px-3 py-2 text-slate-800
                      focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500">
      </div>
    </div>

    <div>
      <label for="ville" class="block text-sm font-medium text-slate-700 mb-1">Ville</label>
      <input type="text" id="ville" th:field="*{ville}" required
             placeholder="Lille"
             class="w-full rounded-md border border-slate-300 px-3 py-2 text-slate-800
                    focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500">
    </div>

    <div>
      <label for="codePostal" class="block text-sm font-medium text-slate-700 mb-1">Code Postal</label>
      <input type="text" id="codePostal" th:field="*{codePostal}" required
             class="w-full rounded-md border border-slate-300 px-3 py-2 text-slate-800
                    focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500">
    </div>

    <div class="flex items-center justify-end gap-3 pt-2 border-t border-slate-200">
      <a th:href="@{/restaurants}"
         class="px-4 py-2 text-sm font-medium text-slate-600 hover:text-slate-800">Annuler</a>
      <button type="submit"
              class="px-4 py-2 rounded-md bg-amber-600 text-white text-sm font-medium
                     hover:bg-amber-700 focus:outline-none focus:ring-2 focus:ring-amber-500
                     focus:ring-offset-2">
        Enregistrer
      </button>
    </div>

  </form>

</div>

</body>
</html>
